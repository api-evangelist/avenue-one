aid: avenue-one
name: Avenue One
description: >-
  Avenue One is a New York-based technology service platform and investment marketplace for
  institutional owners, buyers, sellers, lenders and borrowers of residential rental real estate.
  Founded in 2020, it connects institutional debt and equity capital to local operating partners
  and property owners across 21+ U.S. markets, combining proprietary property data, automated
  valuation, and a vetted partner network to find, finance, buy, renovate, lease, manage and sell
  single-family rental homes at scale. Its service lines span lending (bridge and SFR portfolio
  loans), strategy development, acquisitions, renovations, asset management, title and brokerage
  or dispositions. The company reports $2.2B+ of capital deployed. Its software runs as a private,
  login-gated product suite ("AvenueOS") for internal, builder, investor and partner users; no
  public developer program, API reference, or machine-readable contract is published.
